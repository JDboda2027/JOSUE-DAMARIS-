<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Josué & Damaris | Nuestra Boda</title>

<style>

/* =========================
   CONFIGURACIÓN GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #faf7f2;
    color: #4a4038;
    overflow-x: hidden;
}


/* =========================
   PORTADA
========================= */

.portada {
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.55)
        ),
        url("IMG-20260609-WA0011.jpg")
        center center / cover no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    color: white;
}

.portada-contenido {
    width: 100%;
    max-width: 900px;
    padding: 25px;

    animation: aparecer 2s ease;
}

.pequeno {
    font-size: 18px;
    letter-spacing: 5px;
    margin-bottom: 20px;
}

.nombres {
    font-size: clamp(50px, 12vw, 100px);
    font-weight: normal;
    font-style: italic;
    line-height: 1.1;
    margin-bottom: 20px;
}

.fecha {
    font-size: 22px;
    letter-spacing: 4px;
}

.boton {
    display: inline-block;

    margin-top: 35px;

    padding: 15px 35px;

    border: 1px solid white;
    border-radius: 30px;

    color: white;
    text-decoration: none;

    background: rgba(255,255,255,.1);

    transition: .3s;
}

.boton:hover {
    background: white;
    color: #5a4b40;
}


/* =========================
   SECCIONES
========================= */

section {
    padding: 80px 20px;
    text-align: center;
}

.titulo {
    font-size: 38px;
    font-weight: normal;
    font-style: italic;
    margin-bottom: 20px;
    color: #675548;
}

.subtitulo {
    max-width: 700px;
    margin: auto;

    line-height: 1.8;

    font-size: 18px;
}


/* =========================
   CUENTA REGRESIVA
========================= */

.contador {
    background: #eee5db;
}

.reloj {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 15px;

    margin-top: 35px;
}

.numero {
    background: white;

    width: 100px;

    padding: 20px 10px;

    border-radius: 12px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);
}

.numero strong {
    display: block;

    font-size: 32px;
}

.numero span {
    font-size: 13px;

    text-transform: uppercase;
}


/* =========================
   HISTORIA
========================= */

.historia {
    max-width: 800px;

    margin: auto;

    line-height: 2;

    font-size: 18px;
}


/* =========================
   GALERIA
========================= */

.galeria {
    max-width: 1100px;

    margin: 40px auto 0;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
}

.galeria img {
    width: 100%;

    height: 320px;

    object-fit: cover;

    border-radius: 15px;

    transition: .5s;
}

.galeria img:hover {
    transform: scale(1.03);
}


/* =========================
   VIDEO
========================= */

.video-Boda {
    width: 90%;

    max-width: 400px;

    margin: 30px auto;

    display: flex;

    justify-content: center;

    align-items: center;
}

.video-Boda video {
    display: block;

    width: 100%;

    max-width: 400px;

    height: auto;

    max-height: 500px;

    margin: 0 auto;

    border-radius: 20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);

    object-fit: contain;
}


/* =========================
   INFORMACION
========================= */

.informacion {
    background: #eee5db;
}

.tarjetas {
    max-width: 1000px;

    margin: 40px auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.tarjeta {
    background: white;

    padding: 35px 20px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);
}

.icono {
    font-size: 40px;

    margin-bottom: 15px;
}

.tarjeta h3 {
    margin-bottom: 12px;

    font-size: 22px;
}


/* =========================
   FRASE
========================= */

.frase {
    padding: 100px 20px;
}

.frase p {
    max-width: 800px;

    margin: auto;

    font-size: 27px;

    line-height: 1.7;

    font-style: italic;
}


/* =========================
   CONFIRMACION
========================= */

.confirmacion {
    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.55)
        ),
        url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80")
        center / cover no-repeat;

    color: white;
}

.confirmacion .titulo {
    color: white;
}

.boton-confirmar {
    display: inline-block;

    margin-top: 25px;

    padding: 16px 35px;

    background: white;

    color: #5b4b40;

    text-decoration: none;

    border-radius: 30px;

    font-weight: bold;

    transition: .3s;
}

.boton-confirmar:hover {
    transform: scale(1.05);
}


/* =========================
   PIE DE PAGINA
========================= */

footer {
    background: #3f352e;

    color: white;

    padding: 50px 20px;

    text-align: center;
}

footer h2 {
    font-size: 40px;

    font-style: italic;

    font-weight: normal;
}

footer p {
    margin-top: 15px;
}


/* =========================
   ANIMACIÓN
========================= */

@keyframes aparecer {

    from {
        opacity: 0;

        transform:
            translateY(30px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================
   TABLET
========================= */

@media(max-width: 700px) {

    .galeria {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .galeria img {
        height: 220px;
    }

    .tarjetas {
        grid-template-columns: 1fr;
    }

    section {
        padding: 60px 15px;
    }

    .video-Boda {
        width: 85%;
        max-width: 350px;
    }

    .video-Boda video {
        max-width: 350px;
        max-height: 450px;
    }
}


/* =========================
   CELULAR
========================= */

@media(max-width: 450px) {

    .portada {
        min-height: 100vh;
    }

    .pequeno {
        font-size: 14px;

        letter-spacing: 3px;
    }

    .nombres {
        font-size: 52px;
    }

    .fecha {
        font-size: 17px;

        letter-spacing: 2px;
    }

    .galeria {
        grid-template-columns: 1fr;
    }

    .galeria img {
        height: 300px;
    }

    .titulo {
        font-size: 32px;
    }

    .video-Boda {
        width: 85%;

        max-width: 300px;
    }

    .video-Boda video {
        width: 100%;

        max-width: 300px;

        max-height: 420px;

        border-radius: 15px;
    }

    .frase p {
        font-size: 22px;
    }

    footer h2 {
        font-size: 32px;
    }
}

</style>
</head>

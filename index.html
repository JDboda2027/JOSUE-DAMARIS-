<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Josue & Damaris</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background: #f7f1eb;
            color: #4a3830;
        }

        .portada {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;

            background:
                linear-gradient(
                    rgba(255,255,255,0.55),
                    rgba(255,255,255,0.65)
                ),
                url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1200&q=80");

            background-size: cover;
            background-position: center;
        }

        .tarjeta {
            width: 100%;
            max-width: 480px;
            padding: 45px 25px;
            background: rgba(255,255,255,0.88);
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.18);
        }

        .anillos {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .frase {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .ampersand {
            font-size: 28px;
            font-style: italic;
            margin: 5px 0;
        }

        .mensaje {
            margin-top: 30px;
            font-size: 19px;
            font-style: italic;
        }

        .fecha {
            margin-top: 20px;
            font-size: 17px;
            letter-spacing: 3px;
        }

        .boton {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            border-radius: 30px;
            background: #947064;
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <section class="portada">

        <div class="tarjeta">

            <div class="anillos">💍</div>

            <div class="frase">
                Con la bendición de Dios
            </div>

            <h1>JOSUE</h1>

            <div class="ampersand">&</div>

            <h1>DAMARIS</h1>

            <div class="mensaje">
                ¡Nos casamos!
            </div>

            <div class="fecha">
                NUESTRA BODA · 2026
            </div>

            <a href="#invitacion" class="boton">
                Abrir invitación
            </a>

        </div>

    </section>

</body>
  </html>
